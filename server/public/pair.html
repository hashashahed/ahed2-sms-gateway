<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link device</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .card { max-width: 420px; width: 100%; text-align: center; padding: 28px; }
  .card h1 { font-size: 22px; margin-bottom: 8px; }
  .btn { width: 100%; margin: 18px 0 8px; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title"></h1>
  <p class="muted" id="help"></p>
  <a id="open" class="btn lg" href="#"></a>
  <p class="alert bad hidden" id="err"></p>
</div>
<script src="/assets/i18n.js"></script>
<script>
  (function () {
    const ar = SG.getLang() === 'ar';
    document.getElementById('title').textContent = ar ? 'ربط هذا الجوال' : 'Link this phone';
    document.getElementById('help').textContent = ar
      ? 'تأكد إن تطبيق بوابة الرسائل منصّب، وبعدين اضغط الزر.'
      : 'Make sure the gateway app is installed, then tap the button.';
    const btn = document.getElementById('open');
    btn.textContent = ar ? 'افتح التطبيق واربط' : 'Open the app and link';
    const token = decodeURIComponent(location.hash.slice(1));
    if (!token) {
      btn.classList.add('hidden');
      const e = document.getElementById('err');
      e.textContent = ar ? 'الرابط ناقص. ارجع للوحة التحكم واعمل رابط جديد.' : 'This link is incomplete. Create a new one from the dashboard.';
      e.classList.remove('hidden');
      return;
    }
    const q = 'server=' + encodeURIComponent(location.origin) + '&token=' + encodeURIComponent(token);
    btn.href = /Android/i.test(navigator.userAgent)
      ? 'intent://pair?' + q + '#Intent;scheme=smsgw;package=dev.smsgw.gateway;end'
      : 'smsgw://pair?' + q;
  })();
</script>
</body>
</html>
